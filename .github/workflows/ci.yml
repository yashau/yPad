name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, types, and lint
        run: pnpm run check:ci

      - name: Build
        run: pnpm run build

      - name: Run unit tests
        run: pnpm run test:unit

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm run e2e

      - name: Generate Wrangler config
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          WRANGLER_COMPATIBILITY_DATE: ${{ vars.WRANGLER_COMPATIBILITY_DATE }}
          WRANGLER_NAME: ${{ vars.WRANGLER_NAME }}
          WRANGLER_ROUTE: ${{ vars.WRANGLER_ROUTE }}
          WRANGLER_ROUTES_JSON: ${{ vars.WRANGLER_ROUTES_JSON }}
          WRANGLER_D1_DATABASE_NAME: ${{ vars.WRANGLER_D1_DATABASE_NAME }}
          WRANGLER_D1_DATABASE_ID: ${{ vars.WRANGLER_D1_DATABASE_ID }}
          DISABLE_RATE_LIMITS: ${{ vars.DISABLE_RATE_LIMITS }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "Missing CLOUDFLARE_ACCOUNT_ID secret."
            exit 1
          }
          test -n "${WRANGLER_D1_DATABASE_ID:-$CLOUDFLARE_D1_DATABASE_ID}" || {
            echo "Missing WRANGLER_D1_DATABASE_ID variable or CLOUDFLARE_D1_DATABASE_ID secret."
            exit 1
          }
          pnpm run cf:config

      - name: Deploy Cloudflare Workers
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          WRANGLER_COMPATIBILITY_DATE: ${{ vars.WRANGLER_COMPATIBILITY_DATE }}
          WRANGLER_NAME: ${{ vars.WRANGLER_NAME }}
          WRANGLER_ROUTE: ${{ vars.WRANGLER_ROUTE }}
          WRANGLER_ROUTES_JSON: ${{ vars.WRANGLER_ROUTES_JSON }}
          WRANGLER_D1_DATABASE_NAME: ${{ vars.WRANGLER_D1_DATABASE_NAME }}
          WRANGLER_D1_DATABASE_ID: ${{ vars.WRANGLER_D1_DATABASE_ID }}
          DISABLE_RATE_LIMITS: ${{ vars.DISABLE_RATE_LIMITS }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "Missing CLOUDFLARE_API_TOKEN secret."
            exit 1
          }
          pnpm run cf:deploy

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
